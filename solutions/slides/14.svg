y="184" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="23" font-weight="600" fill="#14181f" font-style="italic">A consulting engagement — we work alongside your developers to improve security.</text><g filter="url(#lift)"><rect x="68" y="222" width="334" height="400" rx="16" fill="#e9eff9" opacity="0.4"/><rect x="68" y="222" width="334" height="400" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="68" y="222" width="334" height="400" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="68" y="222" width="334" height="400" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="82" y="223" width="306" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="84" y="620" width="302" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><rect x="68" y="222" width="6" height="400" rx="3" fill="#1d5fa8"/><g filter="url(#liftsm)"><circle cx="114" cy="272" r="20" fill="#1d5fa8"/><circle cx="114" cy="272" r="20" fill="url(#orb)"/></g><text x="114" y="281" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="23" font-weight="500" fill="#ffffff" text-anchor="middle">1</text><text x="98" y="344" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="27" font-weight="600" fill="#14181f">Full read-only</text><text x="98" y="377" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="27" font-weight="600" fill="#14181f">access</text><text x="98" y="428" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">To the code and the cloud</text><text x="98" y="458" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">instances — every</text><text x="98" y="488" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">component: the app, its</text><text x="98" y="518" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">plugins, identity and</text><text x="98" y="548" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">cloud roles.</text><line x1="98" y1="556" x2="372" y2="556" stroke="#e3e6ec" stroke-width="1"/><text x="98" y="592" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#1d5fa8">The join is where the gaps hide</text><g filter="url(#lift)"><rect x="426" y="222" width="334" height="400" rx="16" fill="#e9eff9" opacity="0.4"/><rect x="426" y="222" width="334" height="400" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="426" y="222" width="334" height="400" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="426" y="222" width="334" height="400" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="440" y="223" width="306" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="442" y="620" width="302" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><rect x="426" y="222" width="6" height="400" rx="3" fill="#1d5fa8"/><g filter="url(#liftsm)"><circle cx="472" cy="272" r="20" fill="#1d5fa8"/><circle cx="472" cy="272" r="20" fill="url(#orb)"/></g><text x="472" y="281" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="23" font-weight="500" fill="#ffffff" text-anchor="middle">2</text><text x="456" y="344" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="27" font-weight="600" fill="#14181f">App developers</text><text x="456" y="428" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">A named developer point</text><text x="456" y="458" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">of contact, and periodic</text><text x="456" y="488" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">meetings with the team</text><text x="456" y="518" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">through the engagement.</text><line x1="456" y1="556" x2="731" y2="556" stroke="#e3e6ec" stroke-width="1"/><text x="456" y="592" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#1d5fa8">We fix alongside them, not at them</text><g filter="url(#lift)"><rect x="785" y="222" width="334" height="400" rx="16" fill="#e9eff9" opacity="0.4"/><rect x="785" y="222" width="334" height="400" rx="16" fill="url(#glass)" opacity="0.45"/><rect x="785" y="222" width="334" height="400" rx="16" fill="url(#gloss)" opacity="0.9"/><rect x="785" y="222" width="334" height="400" rx="16" fill="none" stroke="#e3e6ec" stroke-width="1"/></g><rect x="799" y="223" width="306" height="1.4" rx="0.7" fill="url(#sheen)"/><rect x="801" y="620" width="302" height="1.2" rx="0.6" fill="#0b1a2e" opacity="0.05"/><rect x="785" y="222" width="6" height="400" rx="3" fill="#1d5fa8"/><g filter="url(#liftsm)"><circle cx="831" cy="272" r="20" fill="#1d5fa8"/><circle cx="831" cy="272" r="20" fill="url(#orb)"/></g><text x="831" y="281" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="23" font-weight="500" fill="#ffffff" text-anchor="middle">3</text><text x="815" y="344" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="27" font-weight="600" fill="#14181f">AI, on your account</text><text x="815" y="428" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">Our AI tools run as an</text><text x="815" y="458" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">authorised user of your</text><text x="815" y="488" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">organisation, on your own</text><text x="815" y="518" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#4a5260">AI account.</text><line x1="815" y1="556" x2="1089" y2="556" stroke="#e3e6ec" stroke-width="1"/><text x="815" y="592" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#1d5fa8">Your data never passes through ours</text><text x="68" y="672" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="500" fill="#a87c00">Your code, your cloud, your AI account — the work stays inside your organisation.</text><line x1="68" y1="700" x2="1119" y2="700" stroke="#e3e6ec" stroke-width="1"/><text x="68" y="728" font-family="'Source Serif 4','Iowan Old Style',Georgia,serif" font-size="21" font-weight="600"><tspan fill="#0b0d12">Primus</tspan><tspan fill="#a87c00">Credence</tspan></text><text x="1119" y="728" font-family="'IBM Plex Mono','SF Mono',Menlo,monospace" font-size="21" font-weight="500" fill="#767e8c" text-anchor="end" letter-spacing="1.4">14</text></svg>